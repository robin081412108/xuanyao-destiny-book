name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, build, and copy check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Check BaZi adapter
        run: npm run check:bazi

      - name: Check known BaZi fixtures
        run: npm run check:bazi-fixtures

      - name: Check deployment readiness
        run: npm run check:deploy

      - name: Check user-facing copy
        run: npm run check:copy
